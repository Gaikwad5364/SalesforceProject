name: PR to Develop

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show validation information
        run: |
          echo "=============================================="
          echo "        SALESFORCE PR VALIDATION"
          echo "=============================================="
          echo "Source Branch : ${{ github.head_ref }}"
          echo "Target Branch : develop"
          echo "Target Org    : QA"
          echo "Trigger       : Pull Request"
          echo "=============================================="

      # --------------------------------------------------
      # 2. INSTALL SALESFORCE CLI
      # --------------------------------------------------
      - name: Install Salesforce CLI
        run: |
          echo "=============================================="
          echo "Installing Salesforce CLI"
          echo "=============================================="

          npm install --global @salesforce/cli@latest

          echo ""
          echo "Salesforce CLI version:"
          sf --version

      # --------------------------------------------------
      # 3. AUTHENTICATE TO QA
      # --------------------------------------------------
      - name: Authenticate to QA
        run: |
          echo "=============================================="
          echo "Authenticating to QA Salesforce Org"
          echo "=============================================="

          echo "${{ secrets.QA_SF_AUTH_URL }}" > auth-url.txt

          sf org login sfdx-url \
            --sfdx-url-file auth-url.txt \
            --alias QA_ORG

          echo ""
          echo "Authentication successful."

      # --------------------------------------------------
      # 4. PARSE APEX TESTS FROM PR
      # --------------------------------------------------
      - name: Parse Apex tests from PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "=============================================="
          echo "       PARSING PR TEST CONFIGURATION"
          echo "=============================================="

          node scripts/parsePR.js

          TESTS=$(cat testsToRun.txt)

          echo ""
          echo "Tests extracted from PR:"
          echo "$TESTS"
          echo ""

          if [ "$TESTS" = "all" ]; then

            echo "TEST_LEVEL=RunLocalTests" >> $GITHUB_ENV
            echo "TEST_CLASSES=" >> $GITHUB_ENV

            echo "=============================================="
            echo "Test Mode : RunLocalTests"
            echo "Tests     : ALL LOCAL TESTS"
            echo "=============================================="

          else

            echo "TEST_LEVEL=RunSpecifiedTests" >> $GITHUB_ENV
            echo "TEST_CLASSES=$TESTS" >> $GITHUB_ENV

            echo "=============================================="
            echo "Test Mode : RunSpecifiedTests"
            echo "Tests     : $TESTS"
            echo "=============================================="

          fi

      # --------------------------------------------------
      # 5. SHOW METADATA
      # --------------------------------------------------
      - name: Show metadata being validated
        run: |
          echo "=============================================="
          echo "       METADATA TO BE VALIDATED"
          echo "=============================================="

          find force-app/main/default -type f

          echo ""
          echo "=============================================="

      # --------------------------------------------------
      # 6. VALIDATE SALESFORCE DEPLOYMENT
      # --------------------------------------------------
      - name: Validate Salesforce deployment
        run: |
          echo "=============================================="
          echo "      STARTING PR VALIDATION"
          echo "=============================================="

          echo "Source Branch   : ${{ github.head_ref }}"
          echo "Target Branch   : develop"
          echo "Target Org      : QA"
          echo "Validation Type : Dry Run"
          echo "Test Level      : $TEST_LEVEL"

          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
            echo "Tests           : $TEST_CLASSES"
          else
            echo "Tests           : ALL LOCAL TESTS"
          fi

          echo "=============================================="
          echo ""
          echo "Starting Salesforce validation..."
          echo ""

          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then

            sf project deploy start \
              --target-org QA_ORG \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "$TEST_CLASSES" \
              --wait 30

          else

            sf project deploy start \
              --target-org QA_ORG \
              --dry-run \
              --test-level RunLocalTests \
              --wait 30

          fi

          echo ""
          echo "=============================================="
          echo "       PR VALIDATION SUCCESSFUL"
          echo "=============================================="
          echo "The changes passed Salesforce validation."
          echo "The PR is safe to proceed to the next gate."
          echo "=============================================="
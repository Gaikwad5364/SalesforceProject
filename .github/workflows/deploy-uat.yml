name: Deploy to UAT

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch to deploy"
        required: true
        type: string

      action:
        description: "Choose the action"
        required: true
        type: choice
        options:
          - validate
          - validate-and-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout selected release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Show deployment information
        run: |
          echo "=============================================="
          echo "        SALESFORCE UAT DEPLOYMENT"
          echo "=============================================="
          echo "Release Branch : ${{ inputs.branch }}"
          echo "Action         : ${{ inputs.action }}"
          echo "Target         : UAT"
          echo "=============================================="

      # --------------------------------------------------
      # 2. INSTALL SALESFORCE CLI
      # --------------------------------------------------
      - name: Install Salesforce CLI
        run: |
          echo "=============================================="
          echo "Installing Salesforce CLI"
          echo "=============================================="

          npm install --global @salesforce/cli

          echo ""
          echo "Salesforce CLI version:"
          sf --version

      # --------------------------------------------------
      # 3. AUTHENTICATE
      # --------------------------------------------------
      - name: Authenticate to UAT
        run: |
          echo "=============================================="
          echo "Authenticating to UAT Salesforce Org"
          echo "=============================================="

          echo "${{ secrets.UAT_SF_AUTH_URL }}" > auth-url.txt

          sf org login sfdx-url \
            --sfdx-url-file auth-url.txt \
            --alias UAT_ORG

          echo ""
          echo "Authentication successful."

      # --------------------------------------------------
      # 4. VALIDATE
      # --------------------------------------------------
      - name: Validate deployment to UAT
        run: |
          echo "=============================================="
          echo "        STARTING UAT VALIDATION"
          echo "=============================================="
          echo "Branch          : ${{ inputs.branch }}"
          echo "Target Org      : UAT"
          echo "Validation Type : Dry Run"
          echo "Test Level      : RunSpecifiedTests"
          echo "Tests           : EmployeeTest"
          echo "=============================================="
          echo ""
          echo "Salesforce metadata being validated:"
          find force-app/main/default -type f
          echo ""
          echo "Starting Salesforce validation..."
          echo ""

          sf project deploy start \
            --target-org UAT_ORG \
            --dry-run \
            --test-level RunSpecifiedTests \
            --tests EmployeeTest \
            --wait 30 \
            --json > deploy-result.json

          echo ""
          echo "=============================================="
          echo "        UAT VALIDATION COMPLETED"
          echo "=============================================="

      # --------------------------------------------------
      # 5. EXTRACT DEPLOYMENT ID
      # --------------------------------------------------
      - name: Extract Deployment ID
        if: ${{ inputs.action == 'validate-and-deploy' }}
        run: |
          echo "=============================================="
          echo "Extracting Validation Deployment ID"
          echo "=============================================="

          DEPLOYMENT_ID=$(jq -r '.result.id' deploy-result.json)

          echo "Deployment ID: $DEPLOYMENT_ID"

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      # --------------------------------------------------
      # 6. QUICK DEPLOY
      # --------------------------------------------------
      - name: Quick Deploy to UAT
        if: ${{ inputs.action == 'validate-and-deploy' }}
        run: |
          echo "=============================================="
          echo "        STARTING QUICK DEPLOY TO UAT"
          echo "=============================================="
          echo "Deployment ID : $DEPLOYMENT_ID"
          echo "Target Org    : UAT"
          echo "=============================================="
          echo ""
          echo "Deploying previously validated metadata..."
          echo ""

          sf project deploy quick \
            --job-id $DEPLOYMENT_ID \
            --target-org UAT_ORG \
            --wait 30

          echo ""
          echo "=============================================="
          echo "        UAT DEPLOYMENT SUCCESSFUL"
          echo "=============================================="